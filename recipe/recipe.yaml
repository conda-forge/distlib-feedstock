schema_version: 1

context:
  name: distlib
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: baeb401c90f27acd15c4861ae0847d1e731c27ac3dbf4210643ba61fa1e813db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distlib
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Distribution utilities
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/distlib/
  repository: https://github.com/pypa/distlib
  documentation: https://pythonhosted.org/distlib/

extra:
  recipe-maintainers:
    - nicoddemus
    - xylar
