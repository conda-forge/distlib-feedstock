schema_version: 1

context:
  name: distlib
  version: "0.4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ca4175b4ac7f71223cc30ed7248c45d2b38c2439d8ee6e498ab67ed63cf3508d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - distlib
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Distribution utilities
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/distlib/
  repository: https://github.com/pypa/distlib
  documentation: https://pythonhosted.org/distlib/

extra:
  recipe-maintainers:
    - nicoddemus
    - xylar
